name: Migration numbers

# Two branches cut from the same `main` can each take the next migration number; both pass their own
# checks, both merge, and `main` ends up with two `0042_*.sql` files applied in alphabetical order.
# This job checks the migrations directory of the tree that is ABOUT to land, so it catches the number
# a sibling PR took after this branch was cut. The rule (`unique-number`) lives in tools/migration-lint
# and also runs in `check:fast` with the other migration rules; this workflow runs it alone so branch
# protection has a fast, dependency-free check with one meaning to require — see the migration-lint skill.
#
# What it tests depends on the event, and both are the merged result rather than the branch tip:
#   pull_request — actions/checkout defaults to `refs/pull/<n>/merge`: the PR merged into `main` as
#                  of the last push to the PR. A result goes stale when `main` moves afterwards, so
#                  the required-check + "Require branches to be up to date" branch protection is
#                  what forces a fresh run against current `main` before merging.
#   merge_group    — a merge queue's temporary branch: `main` plus every PR queued ahead. Harmless
#                  until a merge queue is enabled; required checks must report on this event then.
on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  unique-numbers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # NOTE: deliberately NOT filtered by `paths:` and with no `npm ci` step. A required check that
      # a path filter skips never reports, and GitHub then blocks the merge on it forever; and the
      # linter is dependency-free Node (it needs `npm run -w`, not node_modules), so the whole job
      # takes seconds instead of waiting on an install.
      - name: Check migration numbers are unique
        run: npm run lint:migrations -w tools/migration-lint -- --rule unique-number
