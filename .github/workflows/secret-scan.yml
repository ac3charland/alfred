name: Secret Scan

# The repo is public, so every pushed branch is published the moment it lands. CI's check-fast
# (which includes this scan) only runs on pull requests, and commits made through GitHub's web UI
# or API never run the local pre-commit hook — so scan every push, to any branch, on its own.
# See docs/postmortems/2026-09-27-postgres-credential-leak.md.

on:
  push:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Scan tracked files for secrets
        run: npm run lint:secrets -w tools/secret-scan
