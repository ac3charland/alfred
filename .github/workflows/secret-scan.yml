name: Secret Scan

# The repo is public, so every pushed branch is published the moment it lands. CI's check-fast
# (which includes the tree scan) only runs on pull requests, and commits made through GitHub's web
# UI or API never run the local hooks — so scan every push, to any branch, on its own. This is
# detection after the fact; the pre-commit and pre-push hooks are what keep a secret off GitHub.
# See docs/postmortems/2026-09-27-postgres-credential-leak.md.

on:
  push:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + origin/main, so every pushed commit can be scanned, not just the tip.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Scan the pushed tree
        run: npm run lint:secrets -w tools/secret-scan
      # Every commit the push added, so a secret committed and then removed is still caught. A new
      # branch (or a force-push whose old tip is gone) has no usable `before`; scan the branch's
      # commits since main instead.
      - name: Scan every pushed commit
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            npm run lint:secrets -w tools/secret-scan -- --range "$BEFORE..$AFTER"
          else
            npm run lint:secrets:branch -w tools/secret-scan
          fi
