# alfred Software Factory — PR frontmatter enforcing check.
#
# Copy this file to a project repo's `.github/workflows/alfred-frontmatter.yml`.
# It fails the PR check when the machine-readable `alfred` block is missing or
# malformed, so the webhook Worker can always parse a valid block. Coding
# agents are configured to fix failing checks, so they self-correct.
#
# Contract:
#   ```alfred
#   alfred-ticket: ALF-42              # one ref, or a comma-separated list
#   phase: refinement                  # epic-refinement | refinement | implementation | spike
#   spec-path: docs/specs/ALF-42.html  # required on both refinement phases and on a spike
#   ```
#
# An `epic-refinement` PR carries the EPIC's ref and writes the epic's own long-lived
# context/decisions spec (conventionally `docs/specs/epics/<EPIC-REF>.html`).
#
# A `spike` PR carries a research story's ref and writes a long-lived findings document
# (conventionally `docs/spikes/<REF>-<short-slug>.html`) instead of code or a spec. Its
# `spec-path` names that document, so merging the PR records and snapshots it.
#
# Archive rule (implementation PRs): a spec is scaffolding — once it's built, the
# implementation PR retires it from the active specs directory by git-moving it into
# `docs/specs/archive/`. The check fails the PR when the `spec-path` it carries still
# resolves to a file in the active directory (i.e. the spec was left un-archived). A
# skip-refinement (bypass) PR has no file at `spec-path`, so it passes unaffected.
# An EPIC spec is never archived — it is long-lived context later story sessions keep
# reading — so `docs/specs/epics/` is excluded from the rule outright. Spike findings are
# long-lived for the same reason, and live outside `docs/specs/` entirely, so the rule (which
# only fires on `phase: implementation`) never reaches them.

name: alfred-frontmatter
on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Check out the PR's merge result so the archive rule can see whether the spec still sits
      # in the active specs directory after this PR is applied.
      - uses: actions/checkout@v4

      - name: Validate alfred frontmatter block
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          node -e '
            const fs = require("fs");
            const b = process.env.BODY || "";
            const m = b.match(/```alfred\s+([\s\S]*?)```/);
            if (!m) { console.error("missing ```alfred block"); process.exit(1); }
            const blk = m[1];
            const ticket = /alfred-ticket:\s*(.+)/.exec(blk);
            // Alternation order matters: "epic-refinement" ends with "refinement", and the
            // engine takes the first alternative that matches, so the longer phase leads.
            const phase  = /phase:\s*(epic-refinement|refinement|implementation|spike)/.exec(blk);
            if (!ticket || !phase) { console.error("need alfred-ticket + phase"); process.exit(1); }
            const specPath = (/spec-path:\s*(\S+)/.exec(blk) || [])[1];
            // A spike PR with no findings path would merge into a story with nothing to snapshot.
            const SPEC_PATH_PHASES = ["refinement", "epic-refinement", "spike"];
            if (SPEC_PATH_PHASES.includes(phase[1]) && !specPath) {
              console.error("refinement and spike PRs need spec-path"); process.exit(1);
            }
            // An implementation PR must ARCHIVE its spec: git-move it out of the active
            // docs/specs/ directory into docs/specs/archive/. Fail when the recorded spec-path
            // still resolves to a file in the active directory. A bypass PR (no committed spec)
            // has nothing at spec-path, so existsSync is false and it passes. Epic specs are
            // never archived, so docs/specs/epics/ is excluded — belt and braces, since this
            // only fires on phase: implementation, whose spec-path is the STORY spec.
            if (phase[1] === "implementation" && specPath
                && specPath.startsWith("docs/specs/")
                && !specPath.startsWith("docs/specs/archive/")
                && !specPath.startsWith("docs/specs/epics/")
                && fs.existsSync(specPath)) {
              const archived = "docs/specs/archive/" + specPath.split("/").pop();
              console.error("implementation PR must archive its spec: git-move " + specPath + " to " + archived);
              process.exit(1);
            }
            console.log("ok:", ticket[1].trim(), phase[1]);
          '
