name = "alfred-workers"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# ── Routes ────────────────────────────────────────────────────────────────────
# The Worker serves two paths from its one entrypoint (routed in src/index.ts):
#   GET  /                → health check ("alfred workers ok"), plus the classifier's config
#   POST /github/webhook  → the GitHub PR webhook ingress (HMAC-verified)
#   POST /comms/ingest    → the Mac daemon's Comms ingest (HMAC-verified over timestamp + body)
# On the default *.workers.dev domain no `routes` block is needed — the path is
# matched in code. Add a `routes`/`route` entry here only when fronting it with a
# custom domain.

# ── Secrets (set with `wrangler secret put <NAME>`, never committed) ──────────────
# These back the typed `Env` in src/index.ts. For local `wrangler dev`, put the
# same keys in a gitignored `.dev.vars` file (dotenv format).
#   GITHUB_WEBHOOK_SECRET     — shared HMAC secret; must match each repo's webhook config.
#   GITHUB_TOKEN              — fine-grained PAT, Contents:read on the project repos (spec snapshot).
#   SUPABASE_URL              — the project's Supabase URL (e.g. https://<ref>.supabase.co).
#   SUPABASE_SERVICE_ROLE_KEY — service-role key; bypasses RLS for the trusted webhook write.
#   ANTHROPIC_API_KEY         — pay-as-you-go Console key (sk-ant-api03-…) for the Inbox classifier.
#     This is the one manual step in the whole feature: a secret is set by hand, once, outside
#     the repo, and Cloudflare stores it against the WORKER rather than against a deploy — so it
#     survives every subsequent `wrangler deploy` and CI never re-uploads it. It must never
#     become a GitHub Actions secret (no suite may make a live model call), a Vercel env var (the
#     frontend has no LLM code path at all), a `[vars]` entry below (vars are plaintext and
#     committed), or a `.env` file. `npx wrangler secret list` shows the names, never the values.
#     Rotation is the same command again, effective on the next invocation with no redeploy.
#   COMMS_INGEST_HMAC_SECRET  — shared HMAC secret for POST /comms/ingest; the Mac daemon holds the
#     only other copy, in the login keychain. Comms-specific and shared with nothing else, so
#     rotating it cannot disturb the GitHub webhook. Set by hand exactly like the key above; until
#     it is, the endpoint answers 503 rather than accepting anything, and `GET /` says
#     "comms ingest unconfigured" so the missing step is one curl away.
#   GMAIL_OAUTH_CLIENT_ID     — the Google OAuth client the two Gmail polls authenticate through.
#   GMAIL_OAUTH_CLIENT_SECRET — its secret.
#   GMAIL_PERSONAL_REFRESH_TOKEN — refresh token for the personal Gmail account.
#   GMAIL_REALPLAY_REFRESH_TOKEN — refresh token for the RealPlay Gmail account.
#     Both tokens must come from an OAuth client whose publishing status is "In production". A
#     client left in "Testing" issues refresh tokens that expire after seven days with no warning,
#     which would kill both Gmail accounts a week after they start polling — and those are the two
#     sources that do not depend on a Mac being awake.

# ── Cron triggers ─────────────────────────────────────────────────────────────
# The Inbox classifier sweep. `wrangler deploy` registers this schedule, and the Deploy Worker
# workflow runs on every push to main with no path filter — so merging IS deploying, the cron
# included. Two minutes rather than one: nobody is waiting on a tick (the whole premise is
# capture-now-refine-later), and it halves the idle query volume for latency no one perceives.
# A tick with nothing eligible costs one database query and zero model calls.
# Exercise it locally without waiting: `npx wrangler dev --test-scheduled`, then curl the
# `/__scheduled` endpoint it serves.
#
# Two schedules now, dispatched in src/index.ts on the expression the runtime hands the handler —
# so these strings and the constants there must stay in step.
#   */2 * * * *  the frequent tick: the Inbox classifier sweep, then the Comms JUDGE pass.
#   1-59/2 * * * *  the Gmail poll, on the odd minutes. It has its own trigger for one reason: the
#                Workers runtime allows 50 outbound fetches per INVOCATION (Free plan), and polling
#                and judging both scale with how much mail is waiting — sharing a tick, each was
#                the reason the other ran out, and the whole tick threw with "Too many subrequests".
#                Apart, each gets the full 50. Offset by a minute rather than run together so the
#                pipeline still flows one way: mail polled at :01 is judged at :02.
#   17 9 * * *   the daily Comms retention sweep, which deletes every mirrored message older than
#                60 days. Cron triggers are UTC-only, so this lands at 03:17 in Chicago in winter
#                and 04:17 in summer; it is housekeeping in the middle of the night either way and
#                nothing depends on the exact minute. An odd minute rather than :00 for the usual
#                reason — the top of the hour is where every scheduler in the world queues up.
[triggers]
crons = ["*/2 * * * *", "*/3 * * * *", "17 9 * * *"]

# ── Vars (non-secret, plaintext, committed) ──────────────────────────────────
# CLASSIFIER_MODEL — which model judges an Inbox item. A var rather than a constant so trying a
#   different model for a week is a deploy flag rather than a story. Haiku 4.5 by default: at
#   this volume every option is inside noise, so the choice is decided by fit, and the property
#   that matters is structured-output support.
# CLASSIFIER_TIMEZONE — the IANA zone "friday" resolves against. It is the one piece of the
#   prompt that is about the owner rather than the domain, and it changes if they move. The
#   Worker computes an absolute reference date from it and hands the model that, so the model is
#   never asked to know what day it is.
[vars]
CLASSIFIER_MODEL = "claude-haiku-4-5"
CLASSIFIER_TIMEZONE = "America/Chicago"

# WORKER_VERSION is deliberately NOT declared here, unlike the two vars above. It is the commit
# the running build came from, injected per deploy by the Deploy Worker workflow
# (`wrangler deploy --var WORKER_VERSION:<sha>`) and reported by `GET /`. A default would defeat
# it: a deploy that carries no stamp should say so ("unstamped"), because nothing vouches for
# which commit it holds.
#
# The two vars above have no fallback in code — these entries ARE the default. So if a CLI `--var`
# ever SHADOWED this file's `[vars]` rather than merging with them, they would arrive `undefined`
# despite `Env` typing them `string`. `runSweep` checks both before it spends a request and aborts
# the tick if either is missing, counting nothing; `GET /` reports the resolved model and zone, so
# the answer is also one curl away. Shadowing therefore costs a log line, not the Inbox.
